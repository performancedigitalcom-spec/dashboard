<meta charset="utf-8">
<title>Performance Digital Client Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#FFFFFF; --card:#FFFFFF; --tint:#F3F8FC; --tint-2:#E9F2FA;
  --ink:#152238; --sec:#54657D; --muted:#8393A8; --hair:#DCE4EE;
  --pd:#1B75BC; --pd-deep:#0F4F87; --pd-soft:#E4F0FA; --pd-mid:rgba(27,117,188,.45);
  --meta:#1B75BC; --meta-soft:rgba(27,117,188,.14);
  --prog:#E38A2C; --prog-soft:rgba(227,138,44,.16); --prog-mid:rgba(227,138,44,.45);
  --mkt:#7B8797;
  --good:#1E7F4F; --good-soft:#E3F3EA;
  --warn:#B07414; --warn-soft:#FBF1DC;
  --crit:#C2392B; --crit-soft:#FBE7E4;
  --grid:#EDF1F6;
}
*{box-sizing:border-box}
html{background:#fff}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 64px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--hair);margin:0 -24px 22px;padding:14px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.logo{height:44px;width:auto;display:block;flex:none}
.brand-sep{width:1px;height:36px;background:var(--hair);flex:none}
.title-block{min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pd);font-weight:700;margin:0}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:22px;line-height:1.15;margin:2px 0 0;text-wrap:balance}
.controls{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl{display:flex;align-items:center;gap:6px;background:var(--tint);border:1px solid var(--hair);border-radius:9px;padding:5px 8px}
.ctl label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin-right:2px}
input[type=date],select{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--hair);
  border-radius:7px;padding:5px 8px;cursor:pointer;min-height:32px}
input[type=date]:focus,select:focus,button:focus-visible{outline:2px solid var(--pd);outline-offset:1px}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--hair);background:#fff;color:var(--sec);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--pd);color:var(--pd)}
.chip.on{background:var(--pd);border-color:var(--pd);color:#fff}
.btn{appearance:none;border:1px solid var(--pd);background:var(--pd);color:#fff;border-radius:9px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:36px}
.btn:hover{background:var(--pd-deep);border-color:var(--pd-deep)}
.btn svg{width:15px;height:15px}
.btn.ghost{background:#fff;color:var(--pd)}
.btn.ghost:hover{background:var(--pd-soft)}

.rangeline{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin:0 0 16px}
.rangeline b{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:18px;color:var(--ink)}
.rangeline .meta{color:var(--sec);font-size:12.5px}
.rangeline .pill{display:inline-flex;gap:6px;align-items:center;margin-left:12px}
.dotm,.dotp{width:9px;height:9px;border-radius:2px;display:inline-block}
.dotm{background:var(--meta)} .dotp{background:var(--prog)}

/* ---------- summary ---------- */
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
.scard{background:var(--tint);border:1px solid var(--hair);border-radius:12px;padding:13px 16px;border-top:3px solid var(--pd)}
.scard .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);font-weight:700}
.scard .val{font-family:"Fraunces",Georgia,serif;font-size:26px;font-weight:600;margin-top:4px;color:var(--pd-deep);line-height:1.1}
.scard .note{font-size:11.5px;color:var(--sec);margin-top:4px}

section{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:22px 22px 24px;margin-bottom:20px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h2{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:19px;margin:0;color:var(--pd-deep)}
.sec-note{font-size:12px;color:var(--muted)}
.sec-sub{color:var(--sec);font-size:13px;margin:3px 0 14px}

/* ---------- overview table ---------- */
.tblscroll{overflow-x:auto}
table.ov{width:100%;border-collapse:collapse;font-size:12.5px;min-width:860px}
.ov th,.ov td{padding:9px 10px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}
.ov th:first-child,.ov td:first-child{text-align:left}
.ov th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--sec);font-weight:700;cursor:pointer;user-select:none;background:var(--tint)}
.ov th:hover{color:var(--pd)}
.ov th .ar{opacity:.6;font-size:9px}
.ov tbody tr{cursor:pointer}
.ov tbody tr:hover{background:var(--tint)}
.ov tbody tr.sel{background:var(--pd-soft)}
.ov tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--pd)}
.ov .cname{font-weight:600;color:var(--ink)}
.chp{display:inline-block;width:17px;text-align:center;font-size:10px;font-weight:700;border-radius:3px;padding:1px 0;margin-right:2px}
.chp.m{background:var(--meta-soft);color:var(--meta)} .chp.p{background:var(--prog-soft);color:#A8611A} .chp.off{background:var(--tint-2);color:var(--muted)}
.ab{color:var(--good);font-weight:600} .bl{color:var(--crit);font-weight:600} .zero{color:var(--muted)}
.ov tfoot td{font-weight:700;background:var(--tint);border-top:2px solid var(--hair)}

/* ---------- detail ---------- */
.detbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.detbar h2{font-size:24px}
.navbtn{appearance:none;border:1px solid var(--hair);background:#fff;color:var(--sec);border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;line-height:1}
.navbtn:hover{color:var(--pd);border-color:var(--pd)}
.chtag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.chtag.m{background:var(--meta-soft);color:var(--pd-deep)} .chtag.p{background:var(--prog-soft);color:#A8611A}
.chtag i{width:8px;height:8px;border-radius:2px} .chtag.m i{background:var(--meta)} .chtag.p i{background:var(--prog)}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0 4px}
.kpi{background:var(--tint);border:1px solid var(--hair);border-radius:11px;padding:12px 14px}
.kpi .lab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);font-weight:700}
.kpi .val{font-family:"Fraunces",Georgia,serif;font-size:23px;font-weight:600;margin:5px 0 1px;color:var(--pd-deep);line-height:1.1}
.kpi .note{font-size:11.5px;color:var(--sec)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.block{margin-top:18px}
.block h3{font-size:13px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.blocknote{font-size:11.5px;color:var(--muted);margin:0 0 10px}

svg{display:block;width:100%;height:auto;overflow:visible}
.chartwrap{position:relative}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:11.5px;
  padding:7px 9px;border-radius:7px;opacity:0;transform:translate(-50%,-100%);transition:opacity .08s;white-space:nowrap;z-index:5;line-height:1.45}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sec);margin-bottom:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend .ln{width:15px;height:0;border-top:2.5px solid;border-radius:0}

.ctrbars{position:relative;display:flex;flex-direction:column;gap:7px;margin-top:20px}
.ctr-row{display:grid;grid-template-columns:150px 1fr 62px;align-items:center;gap:10px;font-size:12px}
.ctr-row .nm{color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr-track{height:19px;background:var(--tint-2);border-radius:5px;position:relative;overflow:visible}
.ctr-fill{height:100%;border-radius:5px;position:relative;z-index:1}
.ctr-row .pc{font-weight:700;text-align:right}
.bench{position:absolute;top:-2px;bottom:0;width:0;border-left:2px dashed var(--mkt);z-index:3}
.bench-lab{position:absolute;top:-16px;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--mkt);white-space:nowrap;background:#fff;padding:0 3px}
.subh{font-size:11.5px;color:var(--sec);font-weight:700;margin:2px 0 2px}

.hl{display:flex;flex-direction:column;gap:10px}
.hlcard{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--hair);border-radius:10px;padding:12px 14px;background:var(--tint)}
.hlcard .tag{flex:none;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-top:1px}
.hlcard p{margin:0;font-size:13px;color:var(--ink)}
.t-good{background:var(--good-soft);color:var(--good)}
.t-improve{background:var(--crit-soft);color:var(--crit)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-note{background:var(--pd-soft);color:var(--pd-deep)}

.pnote{background:var(--tint);border:1px dashed var(--hair);border-radius:11px;padding:16px;font-size:13px;color:var(--sec);text-align:center}
.mini{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.mini th,.mini td{padding:6px 8px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini th{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--sec);font-weight:700}

footer{color:var(--muted);font-size:12px;text-align:center;margin-top:8px;line-height:1.6}
footer b{color:var(--sec);font-weight:600}
.printhead{display:none}

@media(max-width:960px){
  .summary{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:1fr}
  .ctr-row{grid-template-columns:110px 1fr 54px}
  .controls{margin-left:0;width:100%}
  .brand-sep{display:none}
}
@media(max-width:600px){ .kpis{grid-template-columns:repeat(2,1fr)} }

/* ---------- PDF capture mode (html2canvas snapshot of #detail) ---------- */
.pdfmode #detail{border:0;border-radius:0;padding:24px 28px;width:1180px;max-width:none;background:#fff}
.pdfmode #detail .printhead{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:2px solid var(--pd);padding-bottom:10px;margin-bottom:14px}
.pdfmode #detail .printhead img{height:40px}
.pdfmode #detail .printhead .ph-r{text-align:right;font-size:12px;color:var(--sec)}
.pdfmode #detail .printhead .ph-r b{display:block;font-family:"Fraunces",Georgia,serif;font-size:18px;color:var(--ink);font-weight:600}
.pdfmode #detail .navbtn,.pdfmode #detail .count,.pdfmode #detail .tt{display:none}
.pdfmode #detail .kpis{grid-template-columns:repeat(6,1fr)}
.pdfmode #detail .grid2{grid-template-columns:1fr 1fr}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:all .2s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
.btn:disabled{opacity:.7;cursor:progress}

/* ---------- PDF / print: one client per export ---------- */
@page{size:letter;margin:12mm}
@media print{
  html,body{background:#fff}
  .wrap{max-width:none;padding:0}
  .topbar,.rangeline,.summary,#overview,footer,.navbtn,#clientSel,.detbar .count{display:none !important}
  .printhead{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:2px solid var(--pd);padding-bottom:10px;margin-bottom:14px}
  .printhead img{height:40px}
  .printhead .ph-r{text-align:right;font-size:12px;color:var(--sec)}
  .printhead .ph-r b{display:block;font-family:"Fraunces",Georgia,serif;font-size:18px;color:var(--ink);font-weight:600}
  section{border:0;padding:0;break-inside:auto}
  .kpis{grid-template-columns:repeat(6,1fr);gap:8px}
  .kpi{padding:8px 10px} .kpi .val{font-size:18px}
  .grid2{grid-template-columns:1fr 1fr;gap:14px}
  .block{break-inside:avoid}
  .hlcard{break-inside:avoid}
  svg text{fill:#54657D}
  body{font-size:12px}
  .tt{display:none}
}
</style>

const BM=DATA.benchmarks, META_MKT=BM.meta_ctr, PROG_MKT=BM.prog_display_ctr, FMT_MKT=BM.format_ctr;
const DAYS=DATA.days, FIRST=DAYS[0], LAST=DAYS[DAYS.length-1];
const fmtN=n=>Math.round(n).toLocaleString();
const el=id=>document.getElementById(id);
const ctr=(c,i)=>i?c/i*100:0;
const iso=d=>d.toISOString().slice(0,10);
const pd=s=>new Date(s+"T00:00:00");
const dlab=s=>pd(s).toLocaleDateString("en-US",{month:"short",day:"numeric"});
const dlabY=s=>pd(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

/* ---------- state ---------- */
let from=FIRST, to=LAST, current=null, CLIENTS=[];
let sortKey="comb.impr", sortDir=-1;

/* ---------- aggregate for the selected range ---------- */
function compute(){
  const days=DAYS.filter(d=>d>=from&&d<=to);
  const map={};
  const get=n=>map[n]||(map[n]={client:n,
    meta:{impr:0,clk:0,campaigns:{},daily:{}},
    prog:{impr:0,clk:0,conv:0,formats:{},daily:{}}});
  DATA.meta.forEach(line=>{
    const c=get(line.client); let ci=0,ck=0;
    days.forEach(d=>{const v=line.d[d]; if(!v)return; ci+=v[0]; ck+=v[1];
      const dd=c.meta.daily[d]||(c.meta.daily[d]=[0,0]); dd[0]+=v[0]; dd[1]+=v[1];});
    if(ci||ck){c.meta.impr+=ci; c.meta.clk+=ck;
      const cp=c.meta.campaigns[line.campaign]||(c.meta.campaigns[line.campaign]=[0,0]); cp[0]+=ci; cp[1]+=ck;}
  });
  DATA.prog.forEach(line=>{
    const c=get(line.client); let ci=0,ck=0,cv=0;
    days.forEach(d=>{const v=line.d[d]; if(!v)return; ci+=v[0]; ck+=v[1]; cv+=v[2];
      const dd=c.prog.daily[d]||(c.prog.daily[d]=[0,0,0]); dd[0]+=v[0]; dd[1]+=v[1]; dd[2]+=v[2];});
    if(ci||ck||cv){c.prog.impr+=ci; c.prog.clk+=ck; c.prog.conv+=cv;
      const f=c.prog.formats[line.channel]||(c.prog.formats[line.channel]=[0,0,0]); f[0]+=ci; f[1]+=ck; f[2]+=cv;}
  });
  const out=[];
  Object.values(map).forEach(c=>{
    const m=c.meta,p=c.prog;
    c.hasMeta=m.impr>0; c.hasProg=p.impr>0;
    if(!c.hasMeta&&!c.hasProg)return;
    m.ctr=ctr(m.clk,m.impr); p.ctr=ctr(p.clk,p.impr);
    m.campaigns=Object.entries(m.campaigns).map(([k,v])=>[k,v[0],v[1],ctr(v[1],v[0])]).sort((a,b)=>b[1]-a[1]);
    p.formats=Object.entries(p.formats).map(([k,v])=>[k,v[0],v[1],v[2],ctr(v[1],v[0]),FMT_MKT[k]==null?null:FMT_MKT[k]]).sort((a,b)=>b[1]-a[1]);
    c.daily=days.map(d=>[d,(m.daily[d]||[0,0])[0],(p.daily[d]||[0,0,0])[0],(m.daily[d]||[0,0])[1]+(p.daily[d]||[0,0,0])[1]]);
    c.comb={impr:m.impr+p.impr,clk:m.clk+p.clk,conv:p.conv};
    c.highlights=highlights(c,days);
    out.push(c);
  });
  out.sort((a,b)=>b.comb.impr-a.comb.impr);
  return out;
}

/* ---------- highlights ---------- */
function highlights(c,days){
  const hl=[], m=c.meta, p=c.prog;
  if(c.hasMeta){
    const cr=m.ctr;
    if(cr>=META_MKT*2) hl.push(["good",`Excellent Meta CTR of ${cr.toFixed(2)}% — about ${(cr/META_MKT).toFixed(1)}× the ${META_MKT.toFixed(2)}% industry average.`]);
    else if(cr>=META_MKT) hl.push(["good",`Meta CTR ${cr.toFixed(2)}% clears the ${META_MKT.toFixed(2)}% industry benchmark.`]);
    else hl.push(["improve",`Meta CTR ${cr.toFixed(2)}% is below the ${META_MKT.toFixed(2)}% benchmark — refresh creative or tighten targeting to lift engagement.`]);
    const md=c.daily.map(d=>d[1]); const active=md.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
    if(active.length){
      const first=active[0], last=active[active.length-1], n=md.length;
      if(last<n-1 && n-1-last>=2) hl.push(["warn",`Meta delivery stopped after ${dlab(days[last])} — no impressions for the final ${n-1-last} day(s) of the range; flight ended or paused.`]);
      const gaps=[]; for(let i=first;i<=last;i++) if(md[i]===0) gaps.push(days[i]);
      if(gaps.length && last===n-1) hl.push(["warn",`Pacing gap: no Meta delivery on ${gaps.slice(0,3).map(dlab).join(", ")}${gaps.length>3?" …":""} — check budget or approvals.`]);
      if(m.campaigns.length>1){
        const worst=m.campaigns.reduce((a,b)=>b[3]<a[3]?b:a), best=m.campaigns.reduce((a,b)=>b[3]>a[3]?b:a);
        if(worst[3]<META_MKT && worst!==best) hl.push(["improve",`Within Meta, “${worst[0]}” trails at ${worst[3].toFixed(2)}% CTR vs “${best[0]}” at ${best[3].toFixed(2)}% — rebalance toward the stronger creative.`]);
      }
    }
  }
  if(c.hasProg){
    const f=Object.fromEntries(p.formats.map(x=>[x[0],x]));
    const ctv=f["CTV"], disp=f["Display"], nat=f["Native display"];
    if(p.conv>0) hl.push(["good",`Programmatic drove ${fmtN(p.conv)} conversions on ${fmtN(p.impr)} impressions — the awareness layer is converting.`]);
    if(ctv && ctv[3]===0 && ctv[1]>5000) hl.push(["improve",`CTV ran ${fmtN(ctv[1])} impressions with no measured conversions — confirm CTV conversion tracking is firing.`]);
    if(nat && FMT_MKT["Native display"] && nat[4]>=FMT_MKT["Native display"]) hl.push(["good",`Native display CTR ${nat[4].toFixed(2)}% beats the ~${FMT_MKT["Native display"].toFixed(2)}% native benchmark — the click performer here.`]);
    if(disp && FMT_MKT["Display"] && disp[4]<FMT_MKT["Display"] && disp[1]>0) hl.push(["improve",`Programmatic display CTR ${disp[4].toFixed(3)}% sits under the ~${FMT_MKT["Display"].toFixed(2)}% benchmark — a creative or placement refresh could help.`]);
    if(p.clk===0 && p.impr>0) hl.push(["improve",`Programmatic logged ${fmtN(p.impr)} impressions but 0 clicks — pure awareness delivery; verify that matches the goal.`]);
    const pdaily=c.daily.map(d=>d[2]); const pa=pdaily.map((v,i)=>v>0?i:-1).filter(i=>i>=0);
    if(pa.length){const last=pa[pa.length-1], n=pdaily.length; if(n-1-last>=2) hl.push(["warn",`Programmatic delivery stopped after ${dlab(days[last])} — nothing served for the final ${n-1-last} day(s) of the range.`]);}
  }
  if(c.hasMeta&&!c.hasProg) hl.push(["note","Meta-only in this range — adding programmatic could extend reach and CTV awareness."]);
  if(c.hasProg&&!c.hasMeta) hl.push(["note","Programmatic-only in this range — a Meta layer could add lower-cost clicks."]);
  if(hl.length<2){
    if(c.hasProg&&p.ctr>=PROG_MKT) hl.push(["good",`Programmatic CTR ${p.ctr.toFixed(3)}% is at or above the ~${PROG_MKT.toFixed(2)}% display benchmark.`]);
    else hl.push(["note",`Combined ${fmtN(c.comb.impr)} impressions delivered in this range.`]);
  }
  return hl.slice(0,4);
}

const PRESETS=[
  ["All data",()=>[FIRST,LAST]],
  ["Last 7 days",()=>[shift(LAST,-6),LAST]],
  ["Last 14 days",()=>[shift(LAST,-13),LAST]],

  ["This month",()=>[LAST.slice(0,8)+"01",LAST]],
  ["Last month",()=>{const d=pd(LAST);d.setDate(0);const e=iso(d);return [e.slice(0,8)+"01",e];}],
];
function shift(s,n){const d=pd(s);d.setDate(d.getDate()+n);const r=iso(d);return r<FIRST?FIRST:r;}
function setRange(f,t,fromPreset){
  if(f>t){[f,t]=[t,f];}
  from=f<FIRST?FIRST:f; to=t>LAST?LAST:t;
  el("fromD").value=from; el("toD").value=to;
  document.querySelectorAll("#presets .chip").forEach(ch=>{
    const r=PRESETS[+ch.dataset.i][1](); ch.classList.toggle("on",r[0]===from&&r[1]===to);
  });
  render();
}
el("presets").innerHTML=PRESETS.map((p,i)=>`<button class="chip" data-i="${i}">${p[0]}</button>`).join("");
document.querySelectorAll("#presets .chip").forEach(ch=>ch.addEventListener("click",()=>{const r=PRESETS[+ch.dataset.i][1]();setRange(r[0],r[1],true);}));
["fromD","toD"].forEach(id=>{const i=el(id);i.min=FIRST;i.max=LAST;i.addEventListener("change",()=>{if(el("fromD").value&&el("toD").value)setRange(el("fromD").value,el("toD").value);});});

/* ---------- render everything ---------- */
function render(){
  CLIENTS=compute();
  if(!CLIENTS.length){el("summary").innerHTML="";el("ovTable").innerHTML="";el("detail").innerHTML='<div class="pnote">No delivery in this date range.</div>';return;}
  if(!current||!CLIENTS.find(c=>c.client===current)) current=CLIENTS[0].client;
  const nDays=DAYS.filter(d=>d>=from&&d<=to).length;
  el("rangeTitle").textContent=`${dlabY(from)} – ${dlabY(to)}`;
  el("rangeMeta").innerHTML=` · ${nDays} day${nDays===1?"":"s"}`;
  const mDays=DAYS.filter(d=>DATA.meta.some(l=>l.d[d])), pDays=DAYS.filter(d=>DATA.prog.some(l=>l.d[d]));
  el("rangeCoverage").innerHTML=`Data on file: <span class="pill"><span class="dotm"></span>Meta ${mDays.length?dlab(mDays[0])+" – "+dlab(mDays[mDays.length-1]):"none"}</span><span class="pill"><span class="dotp"></span>Programmatic ${pDays.length?dlab(pDays[0])+" – "+dlab(pDays[pDays.length-1]):"none"}</span><span class="pill">Updated ${DATA.built}</span>`;

  const nMeta=CLIENTS.filter(c=>c.hasMeta).length, nProg=CLIENTS.filter(c=>c.hasProg).length;
  const tImpr=CLIENTS.reduce((a,c)=>a+c.comb.impr,0), tClk=CLIENTS.reduce((a,c)=>a+c.comb.clk,0), tConv=CLIENTS.reduce((a,c)=>a+c.comb.conv,0);
  const tMi=CLIENTS.reduce((a,c)=>a+c.meta.impr,0), tMc=CLIENTS.reduce((a,c)=>a+c.meta.clk,0);
  const tPi=CLIENTS.reduce((a,c)=>a+c.prog.impr,0), tPc=CLIENTS.reduce((a,c)=>a+c.prog.clk,0);
  el("summary").innerHTML=[
    ["Clients",CLIENTS.length,`${nMeta} Meta · ${nProg} programmatic`],
    ["Total impressions",tImpr>=1e6?(tImpr/1e6).toFixed(2)+"M":fmtN(tImpr),`Meta ${fmtN(tMi)} · Prog ${fmtN(tPi)}`],
    ["Total clicks",fmtN(tClk),`Meta ${fmtN(tMc)} · Prog ${fmtN(tPc)}`],
    ["Blended CTR",ctr(tClk,tImpr).toFixed(2)+"%",`Meta ${ctr(tMc,tMi).toFixed(2)}% · Prog ${ctr(tPc,tPi).toFixed(3)}%`],
    ["Conversions",fmtN(tConv),"programmatic (Illumin)"]
  ].map(s=>`<div class="scard"><div class="lab">${s[0]}</div><div class="val">${s[1]}</div><div class="note">${s[2]}</div></div>`).join("");
  el("ovSub").textContent=`CTR cells are green when above the channel's industry benchmark (Meta ${META_MKT.toFixed(2)}%, programmatic display ${PROG_MKT.toFixed(2)}%), red when below. Figures reflect the selected date range.`;

  const sel=el("clientSel"); sel.innerHTML=CLIENTS.map(c=>`<option value="${esc(c.client)}"${c.client===current?" selected":""}>${esc(c.client)}</option>`).join("");
  renderTable(); renderDetail();
}

/* ---------- overview table ---------- */
const COLS=[
  ["client","Client"],["_ch","Channels"],
  ["meta.impr","Meta impr"],["meta.clk","Meta clicks"],["meta.ctr","Meta CTR"],
  ["prog.impr","Prog impr"],["prog.clk","Prog clicks"],["prog.ctr","Prog CTR"],
  ["comb.conv","Conv"],["comb.impr","Total impr"]
];
const dig=(o,k)=>k.split(".").reduce((a,p)=>a&&a[p],o);
function renderTable(){
  const rows=[...CLIENTS].sort((a,b)=>{
    if(sortKey==="_ch")return 0;
    const va=sortKey==="client"?a.client.toLowerCase():dig(a,sortKey), vb=sortKey==="client"?b.client.toLowerCase():dig(b,sortKey);
    return va<vb?-sortDir:va>vb?sortDir:0;
  });
  const head="<thead><tr>"+COLS.map(c=>`<th data-k="${c[0]}">${c[1]} ${sortKey===c[0]?`<span class="ar">${sortDir<0?"▼":"▲"}</span>`:""}</th>`).join("")+"</tr></thead>";
  const body="<tbody>"+rows.map(c=>{
    const ch=`<span class="chp ${c.hasMeta?'m':'off'}">M</span><span class="chp ${c.hasProg?'p':'off'}">P</span>`;
    const mctr=c.hasMeta?`<span class="${c.meta.ctr>=META_MKT?'ab':'bl'}">${c.meta.ctr.toFixed(2)}%</span>`:'<span class="zero">—</span>';
    const pctr=c.hasProg?`<span class="${c.prog.ctr>=PROG_MKT?'ab':'bl'}">${c.prog.ctr.toFixed(3)}%</span>`:'<span class="zero">—</span>';
    const dash='<span class="zero">—</span>';
    return `<tr data-c="${esc(c.client)}"><td class="cname">${esc(c.client)}</td><td>${ch}</td>`
      +`<td>${c.hasMeta?fmtN(c.meta.impr):dash}</td><td>${c.hasMeta?fmtN(c.meta.clk):dash}</td><td>${mctr}</td>`
      +`<td>${c.hasProg?fmtN(c.prog.impr):dash}</td><td>${c.hasProg?fmtN(c.prog.clk):dash}</td><td>${pctr}</td>`
      +`<td>${c.comb.conv?fmtN(c.comb.conv):'<span class="zero">0</span>'}</td><td>${fmtN(c.comb.impr)}</td></tr>`;
  }).join("")+"</tbody>";
  const S=k=>CLIENTS.reduce((a,c)=>a+dig(c,k),0);
  const foot=`<tfoot><tr><td>All clients</td><td></td><td>${fmtN(S("meta.impr"))}</td><td>${fmtN(S("meta.clk"))}</td><td>${ctr(S("meta.clk"),S("meta.impr")).toFixed(2)}%</td><td>${fmtN(S("prog.impr"))}</td><td>${fmtN(S("prog.clk"))}</td><td>${ctr(S("prog.clk"),S("prog.impr")).toFixed(3)}%</td><td>${fmtN(S("comb.conv"))}</td><td>${fmtN(S("comb.impr"))}</td></tr></tfoot>`;
  const t=el("ovTable"); t.innerHTML=head+body+foot;
  t.querySelectorAll("th").forEach(th=>th.addEventListener("click",()=>{
    const k=th.dataset.k; if(k==="_ch")return;
    if(sortKey===k)sortDir*=-1; else{sortKey=k;sortDir=(k==="client")?1:-1;}
    renderTable();
  }));
  t.querySelectorAll("tbody tr").forEach(tr=>tr.addEventListener("click",()=>select(tr.dataset.c,true)));
  markSel();
}
function markSel(){el("ovTable").querySelectorAll("tbody tr").forEach(tr=>tr.classList.toggle("sel",tr.dataset.c===current));}

/* ---------- detail ---------- */
function select(name,scroll){
  current=name; el("clientSel").value=name; renderDetail(); markSel();
  if(scroll) el("detail").scrollIntoView({behavior:"smooth",block:"start"});
}
el("clientSel").addEventListener("change",e=>select(e.target.value,false));

function ctrBarBlock(rows,colorFor,benchFor,decimals,singleBench){
  const maxC=Math.max(...rows.map(r=>Math.max(r[1],benchFor(r[0])||0)),singleBench?singleBench.v:0)*1.02||1;
  const pos=v=>`calc(150px + 10px + (100% - 150px - 10px - 62px - 10px)*${v/maxC})`;
  let html="";
  if(singleBench) html+=`<div class="bench" style="left:${pos(singleBench.v)}"><span class="bench-lab">${singleBench.label}</span></div>`;
  html+=rows.map(r=>{
    const w=Math.max(r[1]/maxC*100,1.0), col=colorFor(r[0],r[1]), bench=benchFor(r[0]);
    const tick=(bench!=null&&!singleBench)?`<div style="position:absolute;top:-3px;bottom:-3px;left:${bench/maxC*100}%;border-left:2px dashed var(--mkt);z-index:2" title="benchmark ${bench}%"></div>`:"";
    const strong=(bench!=null)?r[1]>=bench:true;
    return `<div class="ctr-row"><div class="nm" title="${esc(r[0])}">${esc(r[0])}</div><div class="ctr-track"><div class="ctr-fill" style="width:${w}%;background:${col}"></div>${tick}</div><div class="pc" style="color:${strong?'var(--ink)':'var(--sec)'}">${r[1].toFixed(decimals)}%</div></div>`;
  }).join("");
  return html;
}

/* ---------- pacing chart ---------- */
function drawPace(daily){
  const svg=el("pace"), tip=el("paceTip");
  const W=760,H=250,m={t:14,r:44,b:30,l:48}, iw=W-m.l-m.r, ih=H-m.t-m.b, n=daily.length;
  const mi=daily.map(d=>d[1]), pi=daily.map(d=>d[2]), ck=daily.map(d=>d[3]);
  const nice=v=>{if(v<=10)return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;const s=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return s*p;};
  const maxI=nice(Math.max(...mi,...pi,1)), maxK=nice(Math.max(...ck,1));
  const x=i=>n>1?m.l+(i/(n-1))*iw:m.l+iw/2, yI=v=>m.t+ih-(v/maxI)*ih, yK=v=>m.t+ih-(v/maxK)*ih;
  const kf=g=>g>=1e6?(g/1e6)+"M":g>=1000?(g/1000)+"k":g;
  let s="";
  for(let g=0;g<=4;g++){const v=maxI*g/4;s+=`<line x1="${m.l}" y1="${yI(v)}" x2="${W-m.r}" y2="${yI(v)}" stroke="var(--grid)"/><text x="${m.l-8}" y="${yI(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${kf(v)}</text>`;}
  const every=Math.max(1,Math.ceil(n/12));
  daily.forEach((d,i)=>{if(i%every===0&&(n-1-i>=every/2||i===n-1)||i===n-1)s+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${dlab(d[0])}</text>`;});
  const area=(arr)=>`M${x(0)} ${m.t+ih} `+arr.map((v,i)=>`L${x(i)} ${yI(v)}`).join(" ")+` L${x(n-1)} ${m.t+ih} Z`;
  const line=(arr,y)=>`M`+arr.map((v,i)=>`${x(i)} ${y(v)}`).join(" L");
  if(pi.some(v=>v>0)) s+=`<path d="${area(pi)}" fill="var(--prog-soft)"/><path d="${line(pi,yI)}" fill="none" stroke="var(--prog)" stroke-width="1.6" stroke-linejoin="round"/>`;
  if(mi.some(v=>v>0)) s+=`<path d="${area(mi)}" fill="var(--meta-soft)"/><path d="${line(mi,yI)}" fill="none" stroke="var(--meta)" stroke-width="1.6" stroke-linejoin="round"/>`;
  s+=`<path d="${line(ck,yK)}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round" opacity=".8"/>`;
  for(let g=0;g<=4;g++){const v=maxK*g/4;s+=`<text x="${W-m.r+8}" y="${yK(v)+4}" text-anchor="start" font-size="10" fill="var(--sec)">${kf(v)}</text>`;}
  s+=`<g id="hg" style="opacity:0"><line id="hl" y1="${m.t}" y2="${m.t+ih}" stroke="var(--sec)" stroke-width="1" stroke-dasharray="3 3"/><circle id="hm" r="4" fill="var(--meta)" stroke="#fff" stroke-width="2"/><circle id="hp" r="4" fill="var(--prog)" stroke="#fff" stroke-width="2"/></g>`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="hit"/>`;
  svg.innerHTML=s;
  const hg=svg.querySelector("#hg"),hl=svg.querySelector("#hl"),hm=svg.querySelector("#hm"),hp=svg.querySelector("#hp"),hit=svg.querySelector("#hit");
  function move(e){
    const cx=(e.touches?e.touches[0].clientX:e.clientX), r=svg.getBoundingClientRect();
    let i=Math.round(((cx-r.left)/r.width*W-m.l)/iw*(n-1)); i=Math.max(0,Math.min(n-1,i));
    const d=daily[i];
    hg.style.opacity=1; hl.setAttribute("x1",x(i));hl.setAttribute("x2",x(i));
    hm.setAttribute("cx",x(i));hm.setAttribute("cy",yI(d[1])); hp.setAttribute("cx",x(i));hp.setAttribute("cy",yI(d[2]));
    const cw=svg.closest(".chartwrap").getBoundingClientRect();
    tip.style.left=(r.left+x(i)/W*r.width-cw.left)+"px"; tip.style.top=(Math.min(yI(d[1]),yI(d[2]))/H*r.height-10)+"px";
    tip.innerHTML=`<b>${dlab(d[0])}</b><br>Meta: ${fmtN(d[1])}<br>Programmatic: ${fmtN(d[2])}<br>Clicks: ${fmtN(d[3])}`;
    tip.style.opacity=1;
  }
  hit.addEventListener("mousemove",move); hit.addEventListener("touchmove",move,{passive:true});
  svg.addEventListener("mouseleave",()=>{hg.style.opacity=0;tip.style.opacity=0;});
}

/* ---------- PDF export ---------- */
const exportBtn=el("exportBtn"), exportLabel=exportBtn.innerHTML;
function setBtn(txt,disabled){exportBtn.disabled=!!disabled; exportBtn.innerHTML=txt==null?exportLabel:txt;}
function toast(msg,ms){let t=el("toast"); if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);} t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),ms||3200);}
async function makePdf(){
  if(!window.html2canvas||!window.jspdf) throw new Error("libs");
  const node=el("detail"); document.body.classList.add("pdfmode");
  let canvas;
  try{ canvas=await html2canvas(node,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:1180,scrollX:0,scrollY:-window.scrollY}); }
  finally{ document.body.classList.remove("pdfmode"); }
  const {jsPDF}=window.jspdf, pdf=new jsPDF({unit:"pt",format:"letter",orientation:"portrait"});
  const M=30, PW=612-2*M, PH=792-2*M, imgH=canvas.height*PW/canvas.width;
  if(imgH<=PH){ pdf.addImage(canvas.toDataURL("image/jpeg",.92),"JPEG",M,M,PW,imgH); }
  else{ // paginate a tall render
    const sliceH=Math.floor(PH*canvas.width/PW); let y=0, page=0;
    while(y<canvas.height){
      const h=Math.min(sliceH,canvas.height-y), c=document.createElement("canvas"); c.width=canvas.width; c.height=h;
      c.getContext("2d").drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(page>0)pdf.addPage(); pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",M,M,PW,h*PW/canvas.width);
      y+=h; page++;
    }
  }
  pdf.setProperties({title:`${current} – Paid Media Report`,author:"Performance Digital"});
  return pdf;
}
exportBtn.addEventListener("click",async()=>{
  const fname=`${current.replace(/[^\w\- ]+/g,"").trim()} – Paid Media ${from} to ${to}.pdf`;
  // Embedded in another site (e.g. the Wix page): the frame blocks file downloads, so use the browser's print-to-PDF instead
  if(window.top!==window.self){
    const prev=document.title; document.title=fname.replace(/\.pdf$/,"");
    toast("Choose “Save as PDF” in the print dialog");
    setTimeout(()=>{ window.print(); setTimeout(()=>{document.title=prev;},2000); },300);
    return;
  }
  setBtn("Preparing PDF…",true);
  try{
    const pdf=await makePdf();
    const dl=(window.claude&&claude.use)?await claude.use("downloads"):null;
    if(dl){
      try{ await dl.save({filename:fname,data:pdf.output("arraybuffer")}); toast("PDF saved"); }
      catch(e){ if(e&&e.code==="declined"){} else if(e&&e.code==="rate_limited"){toast("A save prompt is already open — try again in a moment.");} else {toast("Couldn't hand off the PDF here ("+(e&&e.code||"error")+")");} }
    }else{ pdf.save(fname); }
  }catch(e){
    // no PDF libraries reachable (offline copy) — fall back to the browser's own print-to-PDF
    const prev=document.title; document.title=fname.replace(/\.pdf$/,"");
    window.print(); setTimeout(()=>{document.title=prev;},2000);
  }finally{ setBtn(null,false); }
});

/* Public (shared) copies are view-only: hide Export when this view can't hand files to the viewer */
(async()=>{
  if(!(window.claude&&claude.use)) return;              // standalone file: export saves directly
  const dl=await claude.use("downloads");
  if(!dl) exportBtn.hidden=true;
})();
